name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Everything parses
        run: ./tools/lint.sh
      - name: The build scripts do what they say
        run: python3 -m unittest discover -s tests/python -t tests/python
      # Rebuild every data file from the source text. build.sh ends with the
      # audit, which now exits non-zero on any finding that is not in
      # tools/audit-baseline.txt -- so this step really does fail when the
      # parse stops matching the reference counts, which the comment here
      # claimed for a long time while the script returned zero regardless.
      - name: Rebuild data from source
        run: ./tools/build.sh
      - name: Check nothing drifted
        run: |
          if ! git diff --quiet -- docs/data; then
            echo "::error::docs/data is out of date with source/. Run ./tools/build.sh and commit."
            git diff --stat -- docs/data
            exit 1
          fi

  # The browser checks used to run on pull requests only, so anything pushed
  # straight to main -- or merged without a pull request -- went live with
  # nothing having opened the site at all. Deploying is the last moment that
  # can be caught, so it is caught here.
  reader:
    name: The reader works in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: npm --prefix tests ci
      - name: Install Chromium
        run: npm --prefix tests exec -- playwright install --with-deps chromium
      - name: Run the browser checks
        run: node tests/run.js

  deploy:
    needs: [verify, reader]
    # Only the default branch can deploy. The github-pages environment refuses
    # deployments from any other branch, so a feature-branch run used to fail
    # after one second having executed no steps. Those failures were harmless
    # to the site but not harmless to the reader: GitHub's Pages settings
    # screen reports the *most recent* deployment, so every branch push left it
    # showing a failed or unfinished state while the live site was in fact
    # serving happily from the last successful main deploy. Skipping the job
    # outright keeps that status honest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The single-file build is not committed -- it is 13 MB and it is
      # derived -- so the one place it exists is here, made from the same
      # docs/data the verify job has just proved does not drift from source/.
      # Built before the upload so it goes out inside the Pages artifact and
      # the footer link on the live site has something on the end of it.
      # One real page per work and per chapter. The reader is a single page
      # behind hash routes, and a fragment never reaches a server, so without
      # these the whole library is one indexable URL with no scripture on it.
      # Not committed -- 2,709 files rebuilt on every text change -- so, like
      # the offline copy below, the only place they exist is here, inside the
      # artifact that gets uploaded.
      - name: Build the crawlable static pages
        run: python3 tools/build_pages.py docs
      - name: Build the single-file offline copy
        run: python3 tools/build_standalone.py docs docs/the-book.html
      # Stamped with a hash of what it serves, so it is built after the pages
      # above and shipped inside the same artifact. Without this step the
      # live site has a registration pointing at a worker that is not there.
      - name: Build the service worker
        run: python3 tools/build_sw.py docs
      # Pages must already be enabled for the repository, under
      # Settings -> Pages -> Source: GitHub Actions. The workflow cannot turn
      # it on itself: GITHUB_TOKEN lacks the admin right to create the Pages
      # site, so enablement: true fails with "Resource not accessible by
      # integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
