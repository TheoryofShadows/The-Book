name: Checks

# The deploy workflow rebuilds the data on main. This runs on the branches
# and pull requests where a mistake can still be caught before it is merged,
# and adds the browser checks, which the deploy workflow does not run.
# Pull requests only: a branch push with a pull request open would otherwise
# run everything twice for the same commit.
on:
  pull_request:
  # A branch pushed before its pull request exists was tested by nothing:
  # checks.yml ran on pull_request only and pages.yml covers main. The
  # comment above explained the choice as avoiding a double run, and the
  # modern form of that is to trigger on the push and skip the job when a
  # pull request for the same head is already open -- which is what the
  # `if` on each job below does. main is excluded because pages.yml runs
  # everything here on it already.
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than on the ref, which is what stops the same
# commit being checked twice now that a push triggers this as well as a pull
# request. A push is refs/heads/x and a pull request is refs/pull/N/merge --
# different refs, the same branch, the same commit -- so keying on the ref
# deduplicated nothing and keying on the branch deduplicates both.
concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Cheap and fast, so it runs first and says which half broke. Nothing is
  # installed: the build scripts have no dependencies and the tests use the
  # standard library, which is the same reason the site itself ships none.
  units:
    name: The build scripts do what they say
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node too: one of these runs the reader's own copy of the text-folding
      # rule against the Python one, and skips itself if node is missing --
      # which would quietly stop checking the thing it exists to check.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: python3 -m unittest discover -s tests/python -t tests/python -v
      - name: Nothing has a syntax error
        run: ./tools/lint.sh

  data:
    name: Data matches the source text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild every data file from source
        run: ./tools/build.sh
      - name: Check nothing drifted
        run: |
          if ! git diff --quiet -- docs/data; then
            echo "::error::docs/data is out of date with source/. Run ./tools/build.sh and commit."
            git diff --stat -- docs/data
            exit 1
          fi
      # Exits non-zero on any finding that is not in tools/audit-baseline.txt.
      # It used to exit zero whatever it found, which is how three chapters of
      # Ignatius and fifty-six chapter openings went missing without anything
      # going red.
      - name: Audit chapter and verse counts
        run: python3 tools/audit.py docs/data

      # Every verse and paragraph read, and every definition, pin and link
      # resolved. The audit above checks the shape of the library against
      # reference counts; this checks what is inside it. Both are gates
      # against a written-down baseline.
      - name: Verify the text, the definitions, the pins and the links
        run: python3 tools/verify.py docs/data

      # The map is meant to cost less than a photograph. A simplification
      # threshold is easy to loosen by accident and the result is still a
      # working map, just a slower one on the phone most of this is read on.
      - name: The map stays inside its size budget
        run: |
          bytes=$(cat $(find docs/data/basemap -name '*.json') docs/data/mentions.json | wc -c)
          echo "basemap + mention index: $((bytes / 1024)) KB of 250 KB"
          if [ "$bytes" -gt 256000 ]; then
            echo "::error::the map data is over budget at $((bytes / 1024)) KB"
            exit 1
          fi

  # Its own job, and deliberately so. The browser checks stand in for
  # archive.org and prove the recorded-reading code works; this is the only
  # thing that asks whether the recording exists, and it is the only thing
  # here that depends on somebody else's server being up. Kept separate so a
  # red mark on it means one specific thing -- the audio is not there -- and
  # cannot be mistaken for the reader being broken, or drag the reader's own
  # result down with it.
  audio:
    name: The recorded reading has something on the end of it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Exits zero with a "skip" line if archive.org cannot be reached: an
      # outage is not a finding about this repository, and a check that goes
      # red on somebody else's downtime is one people stop reading.
      - name: The audio the reader offers is really served
        run: python3 tools/check_audio.py

  reader:
    name: The reader works in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Playwright's own Chromium, pinned by tests/package-lock.json.
      - name: Install the test dependencies
        run: npm --prefix tests ci
      - name: Install Chromium
        run: npm --prefix tests exec -- playwright install --with-deps chromium
      - name: Run the browser checks
        run: node tests/run.js
